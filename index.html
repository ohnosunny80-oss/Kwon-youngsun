<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light only">
<title>2026 한국건설·안전박람회 상담앱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#12203a}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#12203a;height:100vh;overflow:hidden;color:#111}
#top{position:fixed;top:0;left:0;right:0;min-height:50px;background:#1B2A5C;display:flex;align-items:center;gap:8px;padding:6px 12px;z-index:999;flex-wrap:wrap}
#top h1{font-size:14px;font-weight:800;color:#fff;white-space:nowrap}
#me{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:6px}
#srch{padding:5px 10px;border-radius:6px;border:none;font-size:13px;width:150px;outline:none;background:rgba(255,255,255,.16);color:#fff;font-family:inherit}
#srch::placeholder{color:rgba(255,255,255,.55)}
.fbar{display:flex;gap:4px;flex-wrap:wrap}
.fb{font-size:11px;padding:3px 9px;border-radius:99px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;white-space:nowrap;font-family:inherit}
.fb.on{background:#fff;color:#1B2A5C;font-weight:700;border-color:#fff}
.tabs{margin-left:auto;display:flex;gap:3px}
.tab{font-size:12px;padding:5px 12px;border-radius:6px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;font-family:inherit}
.tab.on{background:#fff;color:#1B2A5C;font-weight:700}
#sync{font-size:10px;color:rgba(255,255,255,.7);white-space:nowrap;cursor:pointer}
#wrap{display:flex;width:100%;height:calc(100vh - var(--toph,84px));margin-top:var(--toph,84px)}
.view{display:none;width:100%;height:100%}
.view.on{display:flex;flex-direction:row;width:100%;height:100%}
#statsView.on{display:flex;flex-direction:column;overflow-y:auto;background:#f4f4f6;padding:16px;width:100%;height:100%}
#mapPanel{flex:1;min-width:0;overflow:hidden;padding:12px;background:#12203a;display:flex;flex-direction:column}
#mapViewport{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#0e1a30;border-radius:8px;cursor:grab}
#mapViewport:active{cursor:grabbing}
#mapStage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;width:1092px;height:1300px}
#mapImg{position:absolute;left:0;top:0;width:1092px;height:1300px;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
#mapSvg{position:absolute;left:0;top:0;width:1092px;height:1300px}
#det{width:380px;flex-shrink:0;background:#fff;color:#111;overflow-y:auto;border-left:1px solid #e8e8e8;display:flex;flex-direction:column}
@media(max-width:768px){
 #top h1{font-size:12px}
 .view.on{flex-direction:column}
 #mapPanel{flex:1;min-height:0;width:100%}
 #det{position:fixed;top:var(--toph,84px);left:0;right:0;bottom:0;width:100%;height:auto;flex:none;border:none;transform:translateY(103%);transition:transform .25s ease;z-index:1500;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
 #det.open{transform:translateY(0)}
 .dh{position:static}
 .detback{display:flex !important}
}
.detback{display:none;align-items:center;gap:8px;padding:12px 15px;background:#1B2A5C;color:#fff;font-weight:800;font-size:15px;cursor:pointer;position:sticky;top:0;z-index:20}
.detback span{margin-left:auto;font-size:12px;font-weight:600;opacity:.85}
.leg{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:#9fb0d0}
.lb{width:12px;height:12px;border-radius:3px}
.det-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ccc;gap:10px;text-align:center;padding:24px}
.dh{padding:13px 15px;border-bottom:1px solid #f0f0f0;background:#fff;position:sticky;top:0;z-index:10}
.dh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bno{font-size:24px;font-weight:900;color:#1B2A5C;line-height:1}
.cnm{font-size:15px;font-weight:700;color:#111;margin-top:3px;line-height:1.3}
.cen{font-size:11px;color:#999}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.bg{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.co-info{font-size:11px;color:#777;display:flex;flex-direction:column;gap:2px;margin-top:6px;line-height:1.6}
.co-info a{color:#1B2A5C;text-decoration:none}
.btn-row{display:flex;gap:6px;margin-top:10px}
.vbtn{flex:1;padding:9px;border:1.5px solid #ddd;border-radius:8px;cursor:pointer;font-size:12px;background:#fff;color:#555;font-family:inherit;font-weight:700}
.vbtn.done{background:#e8f5e9;color:#2e7d32;border-color:#2e7d32}
.cbtn.done{background:#fff8e1;color:#e65100;border-color:#e65100}
.sec{padding:11px 15px;border-bottom:1px solid #f2f2f2}
.sec:last-child{border-bottom:none}
.sh{font-size:10px;font-weight:700;color:#aaa;letter-spacing:.6px;margin-bottom:8px}
.msgbox{background:#e3f2fd;border:1px solid #90caf9;border-radius:8px;padding:10px 12px;font-size:12px;color:#1B2A5C;line-height:1.6}
.pc{border:1px solid #eee;border-radius:8px;padding:10px 12px;border-left:4px solid #6a1b9a;margin-bottom:6px}
.pname{font-size:12px;font-weight:700;color:#111;line-height:1.4}
.pmeta{font-size:10px;color:#999;line-height:1.7}
.cnt{display:inline-block;font-size:10px;background:#ede7f6;color:#4527a0;padding:1px 7px;border-radius:99px;font-weight:700;margin-right:4px}
.chip{display:inline-block;font-size:10px;background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:99px;margin:2px 3px 0 0;font-weight:600}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;margin-right:4px;font-weight:700}
.note-ta{width:100%;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;padding:10px 12px;resize:vertical;min-height:90px;line-height:1.7;font-family:inherit;outline:none;color:#111}
.note-ta:focus{border-color:#1B2A5C}
.nodata{font-size:11px;color:#bbb;font-style:italic}
.warn{background:#fff3e0;border:1px solid #ffb74d;border-radius:8px;padding:8px 10px;font-size:11px;color:#e65100;line-height:1.5}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.sc{background:#fff;border-radius:10px;padding:14px;border:.5px solid #eee}
.sv{font-size:26px;font-weight:800;color:#1B2A5C}.sl{font-size:11px;color:#999;margin-top:3px}
.shd{font-size:14px;font-weight:700;color:#222;margin:4px 0 10px}
.vl{background:#fff;border-radius:10px;border:.5px solid #eee;overflow:hidden;margin-bottom:16px}
.vr{display:flex;flex-direction:column;padding:11px 14px;border-bottom:.5px solid #f2f2f2;font-size:12px;gap:4px}
.vr:last-child{border-bottom:none}
#statsInner{max-width:880px;margin:0 auto;width:100%;padding-bottom:40px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:99px}
.procbox{background:#e3f2fd;border:1px solid #90caf9;border-radius:8px;padding:10px 12px}
.qrow{display:flex;flex-wrap:wrap;gap:5px}
.qbtn{font-size:11px;padding:6px 10px;border:1.5px solid #1B2A5C;background:#fff;color:#1B2A5C;border-radius:99px;cursor:pointer;font-family:inherit;font-weight:600}
.qbtn:active{background:#1B2A5C;color:#fff}
.aiin{flex:1;min-width:0;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;outline:none}
.aiq{margin-top:8px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px}
.ai-lbl{font-size:9px;font-weight:700;color:#15803d;margin-bottom:4px}
.ai-txt{font-size:11px;color:#14532d;line-height:1.65;white-space:pre-wrap}
.savebtn{margin-top:7px;font-size:11px;padding:5px 12px;background:#15803d;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
.certline{font-size:11px;padding:5px 9px;border-radius:6px;margin-bottom:4px;line-height:1.45;display:flex;justify-content:space-between;gap:8px;align-items:center}
.certline.ok{background:#e8f5e9;color:#2e7d32}
.certline.exp{background:#fbe9e7;color:#c62828}
.certline.chk{background:#fff3e0;color:#e65100}
.certline .cd{font-size:10px;opacity:.85;font-family:monospace;text-align:right}
.zoombar{display:flex;gap:6px;align-items:center;margin-bottom:8px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.zoombar button{min-width:36px;height:32px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:7px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.zoombar button:active{background:#fff;color:#1B2A5C}
.zoombar #zoomhint{font-size:10px;color:#9fb0d0;margin-left:2px}
#bin{width:84px;height:32px;border-radius:7px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:700;padding:0 8px;outline:none;font-family:inherit;text-transform:uppercase}
#bin::placeholder{color:rgba(255,255,255,.5);font-weight:400;font-size:11px}
#listView.on{display:flex;flex-direction:column;overflow-y:auto;background:#f4f4f6;padding:12px;width:100%;height:100%}
#listInner{max-width:760px;margin:0 auto;width:100%;padding-bottom:40px}
.lsec{font-size:13px;font-weight:800;color:#1B2A5C;margin:14px 4px 8px}
.lsec span{font-size:11px;color:#999;font-weight:600}
.lrow{display:flex;align-items:center;gap:10px;background:#fff;border:.5px solid #eee;border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.lrow:active{background:#eef4ff}
.lrow.sel{border-color:#FFD600;box-shadow:0 0 0 2px #FFD600}
.lb2{font-size:13px;font-weight:800;color:#1B2A5C;min-width:50px}
.ln{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ln b{font-size:13px;color:#111;line-height:1.3}
.lsp{font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lchips{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;max-width:130px}
.lc{font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px;background:#eee;color:#666;white-space:nowrap}
.lc.v{background:#e8f5e9;color:#2e7d32}.lc.cd{background:#fff8e1;color:#e65100}.lc.ct{background:#f3e5f5;color:#6a1b9a}.lc.pt{background:#e3f2fd;color:#1B2A5C}
#catbar{flex:none;display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;position:sticky;top:0;background:#f4f4f6;z-index:5}
#catbar::-webkit-scrollbar{height:0}
.catchip{flex:none;font-size:12px;font-weight:600;padding:7px 13px;border-radius:99px;border:1.5px solid #ccd;background:#fff;color:#555;cursor:pointer;white-space:nowrap}
.catchip.on{background:#1B2A5C;color:#fff;border-color:#1B2A5C}
.bigbtn{width:100%;padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px}
@media(max-width:768px){.zoombar #zoomhint{display:none}}
</style>
</head>
<body>
<div id="top">
  <h1>🏗 2026 한국건설·안전박람회</h1>
  <span id="me">👤 권영선</span>
  <input id="srch" placeholder="업체명·부스 검색" oninput="onSearch()">
  <div class="fbar">
    <button class="fb on" onclick="setF(this,'all')">전체</button>
    <button class="fb" onclick="setF(this,'dm')">📮 DM 84</button>
    <button class="fb" onclick="setF(this,'route')">🚶 동선</button>
    <button class="fb" onclick="setF(this,'t1')">1순위</button>
    <button class="fb" onclick="setF(this,'t2')">2순위</button>
    <button class="fb" onclick="setF(this,'t3')">3순위</button>
    <button class="fb" onclick="setF(this,'pat')">특허</button>
    <button class="fb" onclick="setF(this,'cert')">🏅 인증</button>
    <button class="fb" onclick="setF(this,'uv')">미방문</button>
    <button class="fb" onclick="setF(this,'card')">🪪 명함</button>
  </div>
  <span id="sync" onclick="setBIN()">☁ 로컬저장 (탭하면 클라우드)</span>
  <div class="tabs">
    <button class="tab on" onclick="showTab(this,'map')">🗺 지도</button>
    <button class="tab" onclick="showTab(this,'list')">📋 목록</button>
    <button class="tab" onclick="showTab(this,'stats')">📊 통계</button>
  </div>
</div>
<div id="wrap">

        <button onclick="zBtn(1)">＋</button>

        <button onclick="goBooth()" style="width:auto;padding:0 10px;font-size:12px">이동</button>
        <span id="zoomhint">✌️ 두 손가락으로 확대·축소 · 끌어서 이동 · 부스 탭하면 상세</span>
      </div>
      <div class="leg">

function initGestures(){
  var vp=vpEl(); if(!vp||vp._g)return; vp._g=1;
  vp.addEventListener('pointerdown',function(e){
    vp.setPointerCapture(e.pointerId); _pts[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Object.keys(_pts).length===1){_downT=Date.now();_downCX=e.clientX;_downCY=e.clientY;_moved=0;}
  });
  vp.addEventListener('pointermove',function(e){
    if(!_pts[e.pointerId])return; e.preventDefault();
    var prev=_pts[e.pointerId], ids=Object.keys(_pts);
    if(ids.length>=2){
      _pts[e.pointerId]={x:e.clientX,y:e.clientY};
      var a=_pts[ids[0]],b=_pts[ids[1]];
      var dist=Math.hypot(a.x-b.x,a.y-b.y), mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      var vpr=vp.getBoundingClientRect();
      if(_lastDist){
        var mx=mid.x-vpr.left,my=mid.y-vpr.top;
        var sx=(mx-stageX)/stageScale, sy=(my-stageY)/stageScale;
        stageScale=Math.min(8,Math.max(0.1,stageScale*(dist/_lastDist)));
        stageX=mx-sx*stageScale; stageY=my-sy*stageScale;
        if(_lastMid){stageX+=mid.x-_lastMid.x; stageY+=mid.y-_lastMid.y;}
        clampStage(); stageApply();
      }
      _lastDist=dist; _lastMid=mid;
    } else {
      var dx=e.clientX-prev.x, dy=e.clientY-prev.y; _moved+=Math.abs(dx)+Math.abs(dy);
      _pts[e.pointerId]={x:e.clientX,y:e.clientY};
      stageX+=dx; stageY+=dy; clampStage(); stageApply();
    }
  });
  function up(e){
    var wasTap=(Object.keys(_pts).length===1 && _moved<12 && (Date.now()-_downT)<500);
    delete _pts[e.pointerId]; if(Object.keys(_pts).length<2){_lastDist=0;_lastMid=null;}
    if(wasTap)tapAt(_downCX,_downCY);
  }
  vp.addEventListener('pointerup',up); vp.addEventListener('pointercancel',function(e){delete _pts[e.pointerId];if(Object.keys(_pts).length<2){_lastDist=0;_lastMid=null;}});
  vp.addEventListener('wheel',function(e){e.preventDefault();var r=vp.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top, e.deltaY<0?1.12:1/1.12);},{passive:false});
}

var mediaRec=null,isRec=false;
function startWhisper(id){
  var btn=document.getElementById('wbtn-'+id);
  var ta=document.querySelector('#det .note-ta');
  if(isRec){isRec=false;if(mediaRec&&mediaRec.state==='recording')mediaRec.stop();return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var chunks=[];isRec=true;mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=function(e){if(e.data&&e.data.size>0)chunks.push(e.data);};
    mediaRec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});isRec=false;
      btn.textContent='⏳ AI 변환 중...';btn.style.background='#ff9800';
      if(!chunks.length){btn.textContent='🎙 녹음 시작 → AI 자동 변환';btn.style.background='#4caf50';return;}
      var blob=new Blob(chunks,{type:'audio/webm'});
      fetch(WORKER,{method:'POST',headers:{'Content-Type':'audio/webm'},body:blob}).then(function(r){return r.json();}).then(function(d){
        if(d.text&&ta){ta.value=ta.value+(ta.value?'\n':'')+d.text;saveNote(id,ta.value);}
        btn.textContent='🎙 녹음 시작 → AI 자동 변환';btn.style.background='#4caf50';
      }).catch(function(e){btn.textContent='🎙 녹음 시작 → AI 자동 변환';btn.style.background='#4caf50';alert('변환 실패: '+e.message);});
    };
    mediaRec.start(1000);btn.textContent='⏹ 녹음 중... (탭하면 변환)';btn.style.background='#f44336';
  }).catch(function(){isRec=false;alert('마이크 권한을 허용해주세요.');});
}

    if(d.card)for(var k3 in d.card)STATE.card[k3]=d.card[k3];
    saveLocal();push();rebuildMaps();renderStats();
    alert('복원 완료 ✓  방문 '+Object.keys(STATE.v).length+'곳 · 명함 '+Object.keys(STATE.card).length+'곳');
  }catch(e){alert('코드 형식이 올바르지 않습니다. 복사한 KCS1... 코드 전체를 붙여넣어 주세요.');}
}
function genReport(){
  var vb=[];for(var k in STATE.v)if(isVis(k)&&byId[k])vb.push(k);
  if(!vb.length){alert('방문한 업체가 없습니다.');return;}
  var key=getAKEY(); if(!key)return;
  var list=vb.map(function(id,i){var c=byId[id];var nt=(STATE.n[id]||{}).x||'';
    return (i+1)+'. ['+(c.b||'미확인')+'] '+c.n+(c.t?' ('+TN[c.t]+')':'')+(c.i?' | '+c.i:'')+(c.pt?' | 특허 '+c.pt+'건(7년미만 본인 '+(c.p7||0)+')':'')+(c.cv?' | 인증 '+c.cv:'')+(hasCard(id)?' | 명함수령':'')+(nt?' | 메모: '+nt:'');}).join('\n');
  var d=new Date(),ds=d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate();
  var prm='당신은 특허·인증 컨설팅 회사(한국조달컨설팅)의 박람회 상담 보고서 작성 전문가입니다.\n\n'+ds+' 2026 한국건설·안전박람회(킨텍스) 현장 상담 데이터입니다. 담당: 권영선.\n방문 '+vb.length+'곳.\n\n[방문 업체]\n'+list+'\n\n다음 형식의 한국어 보고서를 작성하세요:\n1. 오늘 성과 요약(3줄)\n2. 최우선 후속 조치 TOP 3~5 (이유·권장액션)\n3. 전체 방문 업체 정리(핵심 1~2줄)\n4. 내일/이번주 할 일\n5. 인사이트(특허·조달 관점). 실무자가 바로 이메일 보낼 수 있게 구체적으로.';
  var m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;flex-direction:column';
  m.innerHTML='<div style="background:#1B2A5C;padding:14px 16px;display:flex;justify-content:space-between;align-items:center"><b style="color:#fff;font-size:14px">🤖 AI 보고서</b><button onclick="this.closest(\'div\').parentNode.remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;padding:5px 12px;border-radius:5px;cursor:pointer">✕ 닫기</button></div><div id="rb" style="flex:1;overflow-y:auto;padding:16px;color:#fff;white-space:pre-wrap;font-size:13px;line-height:1.8">분석 중... ⏳</div><div style="padding:12px;background:#1a1a1a"><button id="cp" style="width:100%;padding:12px;background:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">📋 복사하기</button></div>';
  document.body.appendChild(m);
  fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true','x-api-key':key,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:2000,messages:[{role:'user',content:prm}]})})
  .then(function(r){return r.json();}).then(function(d2){var rep=(d2.content&&d2.content[0]&&d2.content[0].text)||('생성 실패'+(d2.error?': '+d2.error.message:''));var full='2026 한국건설·안전박람회 상담 결과 보고서\n'+ds+' | 한국조달컨설팅\n━━━━━━━━━━━━━━━━━━━━\n\n'+rep;var rb=document.getElementById('rb');rb.style.color='#111';rb.style.background='#fff';rb.textContent=full;document.getElementById('cp').onclick=function(){navigator.clipboard.writeText(full).then(function(){document.getElementById('cp').textContent='✅ 복사완료';});};})
  .catch(function(e){document.getElementById('rb').textContent='오류: '+e;});
}
